apiVersion: v2
name: hostedclusters-setup
description: >-
  Per-hosted-cluster setup, rendered by the gitops-day1 ApplicationSet cascade
  from sites/<site>/mces/<mce>/hostedClusters/<cluster>.yaml. Carries the DHCP
  scope Request, the day2 registration Job, the release-segment PostDelete
  hook and, with hostedCluster.enabled, the HostedCluster and its NodePools —
  see README.
type: application
