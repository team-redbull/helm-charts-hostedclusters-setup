# Base of the merge. Argo CD layers the four values-repo files on top of this, in
# order (hcAppset.yaml):
#
#   this file                                             <- dhcp_api, crossplane
#     -> sites/configValues.yaml                          <- dhcp_values globals
#       -> sites/<site>/values.yaml
#         -> sites/<site>/mces/<mce>/values.yaml
#           -> sites/<site>/mces/<mce>/hostedClusters/<cluster>.yaml
#
# A key set here cannot be unset downstream, so this file carries only what is
# genuinely constant across every hosted cluster.

# The hosted cluster's own name, e.g. "ocp4-prep-herzi-site1-a".
#
# Passed in by hcAppset.yaml as a Helm parameter (--set), NOT from the values repo: it comes
# from the name of the cluster's values file, and Helm has no notion of which file a value
# came from — it merges the four valueFiles into one flat .Values. The appset derives it
# from the same `.path.filename | trimSuffix` expression that names the Application.
#
# dhcp_values.scopeName defaults to this upper-cased, so a values file never has to repeat
# a name its own file name already carries. A chart-owned key rather than injecting straight
# into dhcp_values.scopeName because helm parameters outrank valueFiles: written there, an
# explicit scopeName in a values file could never win.
#
# Only dhcp.scopeName upper-cases, and only the derived name. This value stays as written:
# it also names the Argo Application and derives the CR's hcp-<clusterName> namespace, which
# Kubernetes requires to be lowercase.
#
# Empty here so a render without the appset fails loudly in dhcp.scopeName rather than
# silently producing a scope with no name.
clusterName: ""

crossplane:
  # Namespace the Request CR is created in. The chart renders the NAMESPACED Request
  # kind (http.m.crossplane.io/v1alpha2, Crossplane v2's `.m.` group), so this field
  # is always emitted — an object with no namespace would land in `default`.
  #
  # provider-http v1.0.14 ships two separate Request CRDs; confirm both with:
  #
  #   kubectl get crd requests.http.crossplane.io   -o jsonpath='{.spec.scope}'  # Cluster
  #   kubectl get crd requests.http.m.crossplane.io -o jsonpath='{.spec.scope}'  # Namespaced
  #
  # This decides ONLY where the Request lands. The Bearer-token Secret's namespace is
  # dhcp_api.tokenSecretRef.namespace below, set explicitly and separately. The two
  # used to be one value, which is exactly what forced a copy of the token into every
  # hosted cluster's namespace.
  #
  # Unset, dhcp.crNamespace derives `hcp-<clusterName>`. That is what the AIR-GAPPED
  # copy of this chart uses: there each Request sits beside its own hosted control
  # plane, while the token it reads lives once per cluster in dhcp-scope-manager.
  #
  # This copy pins dhcp-scope-manager for the Request too — the cluster has no hcp-*
  # namespaces, so the derivation would name nothing that exists.
  # Set here rather than in the ApplicationSet because it is a property of this
  # environment's chart copy, not of how Applications are generated.
  #
  # hcAppset.yaml points the Application's destination at openshift-gitops, so Argo CD's
  # AppProject has to permit writes into whichever namespace this resolves to — a
  # resource declaring a namespace outside the project's destinations is refused at sync
  # time, and the error names the project rather than the namespace.
  namespace: dhcp-scope-manager

  # Name of the Crossplane provider config holding the DHCP API connection.
  # Installed by redbull-platform's provider-http chart.
  #
  # This must be an object in the `.m.` group — a namespaced Request cannot reference
  # the legacy http.crossplane.io ProviderConfig of the same name. Kind is configurable
  # because the group offers both: ClusterProviderConfig (cluster-wide, the default —
  # one DHCP API serves the whole platform) and ProviderConfig (namespaced, which would
  # need one per hosted-cluster namespace).
  providerConfigKind: ClusterProviderConfig
  providerConfigName: dhcp-http

# Where the DHCP scope API lives.
#
# A platform constant, not per-cluster config: there is one Windows DHCP server
# (plus its failover partner) shared by every site, and one API in front of it.
# The partner is a failover peer, not an independent server — it gets no API of
# its own and is managed through the failover relationship on the primary.
#
# In-cluster Service address on purpose: Crossplane provider-http runs in the
# same cluster, so a Route would add a public hop and TLS for no benefit.
#
# If a genuinely separate DHCP server ever appears it needs its own API, and this
# key moves down to sites/<site>/values.yaml. Nothing in the chart or the CI
# validator has to change for that — Helm merges it and the validator ignores
# keys it does not own.
dhcp_api:
  url: http://dhcp-scope-manager.dhcp-scope-manager.svc.cluster.local:8080

  # Skip TLS verification on the requests provider-http makes to the url above.
  #
  # true because the air-gapped copy of this chart reaches the API through an
  # OpenShift Route, whose certificate is signed by the cluster's own ingress CA.
  # provider-http does not trust it, so every reconcile fails before the request is
  # sent — "x509: certificate signed by unknown authority" — and the scope is never
  # created. Against the url above it changes nothing: plain http has no certificate
  # to verify.
  #
  # The cost is that the Bearer token below rides an unverified connection, so set
  # this to false once provider-http trusts that CA. An explicit false is honoured
  # (the template uses ternary, not `default`, precisely so it can be).
  insecureSkipTLSVerify: true

  # Bearer token for the API. The API disables auth entirely when its own
  # DHCP_API_TOKEN is unset, and an empty ref here renders no Authorization
  # header at all — so this was `{}` while the API ran unauthenticated.
  #
  # It is filled in because the API requires a Bearer token for every WRITE from
  # the moment the deploy chart is up, and a Request with no Authorization header
  # gets 401 on every reconcile. (Its scope GETs are anonymous, so only the
  # create/update half needs this — but a Request does both.)
  #
  # These three name the Secret that helm-charts-dhcp-scope-manager's
  # dhcp-api-token subchart renders, from one token committed in that chart. That
  # subchart is deployed standalone to each MCE too, which is what puts one Secret
  # per cluster here. provider-http's ClusterRole grants secrets/* cluster-wide,
  # so every hosted cluster's Request reads that one Secret across namespaces.
  #
  # All three keys are required: provider-http resolves them from the live Secret
  # at reconcile time and stores only the {{ name:namespace:key }} placeholder in
  # the CR's spec and logs, so the token never reaches git or the Argo CD UI.
  #
  # `namespace` is set EXPLICITLY, and both copies of this chart set it to this same
  # literal. It used to be absent, defaulting to crossplane.namespace — the Request's
  # own — on the theory that the Secret should sit beside the CR. In the air-gapped
  # environment that resolves to hcp-<clusterName>, which meant one copy of the token
  # in every hosted cluster's namespace: N copies of one credential per MCE, all of
  # which had to rotate together.
  #
  # Now the token is deployed once per cluster into dhcp-scope-manager — by the
  # dhcp-api-token subchart of helm-charts-dhcp-scope-manager, standalone on each MCE
  # and alongside the API on the mgmt cluster — and every hosted cluster's Request
  # reads that one Secret. provider-http's ClusterRole grants secrets/* cluster-wide,
  # so reading it from another namespace needs no extra RBAC.
  #
  # It renders identically in this copy, where crossplane.namespace is already
  # dhcp-scope-manager, so writing it out costs nothing here and makes the two chart
  # copies agree byte-for-byte on this key instead of relying on a default that means
  # different things in each.
  #
  # Still needed even though the API's scope GETs are anonymous now: a Request writes.
  #
  # All three are hardcoded on the other side too — the dhcp-api-token subchart
  # writes exactly this Secret name and key, and STAMPS this namespace as a literal
  # rather than taking the release namespace, so the Secret lands where this
  # placeholder looks however that chart is deployed. The deploy chart's
  # apiAuth.secretName/tokenKey point at the same name and key. Changing any of them
  # means changing all three places, and a mismatch is not a render error: it is a placeholder
  # naming a Secret that does not exist, which provider-http passes through as
  # literal text. Nothing generates this Secret and nothing creates it by hand;
  # both of those paths were removed (a generated one was re-minted on every Argo
  # sync, an out-of-band one was invisible to git).
  #
  # A ref missing name or key renders no Authorization header at all, rather than a
  # placeholder provider-http cannot parse — an unparseable one is passed through as
  # literal text with no error raised, which is a 401 on every reconcile that names
  # nothing. The namespace cannot go missing, since it falls back to the Request's —
  # but it CAN now be wrong, because it is no longer derived from the same variable
  # as metadata.namespace. That is what the render test pins.
  #
  # Set `tokenSecretRef: null` to go back to unauthenticated requests.
  tokenSecretRef:
    name: dhcp-scope-manager-token
    key: api-token
    namespace: dhcp-scope-manager

# dhcp_values is NOT set here on purpose.
#
# It is owned entirely by the values repo (day1 / platform-config). A value set
# here would be inherited by every hosted cluster and could not be unset by a
# site or cluster file — and since the Request CR is named after
# dhcp_values.network, every cluster would collide on one object name.
#
# The DHCP template is gated on dhcp_values.network, so a cluster file with no
# dhcp_values block renders no Request at all. That is the correct outcome for a
# cluster that does not need a scope. (It was gated on scopeName until that gained a
# default — see dhcp.scopeName — which made it resolve for every cluster and gate
# nothing. network is the scope's identity and only a cluster's own file ever sets it.)
#
# See docs/dhcp_values.md in team-redbull/dhcp_scope_manager for the field
# reference.

# Registering this hosted cluster with the day2 sig repos.
#
# day2 (gitops-day2-prod) decides *where* charts run, and its entire registration
# mechanism is the existence of a folder: a cluster exists for a sig when
# sites/<site>/<env>/mces/<mce>/<cluster>/ exists in that sig's repo. Day1 is what
# brings the cluster into existence, so day1 is what can create that folder — see
# templates/add-cluster-to-day2-job.yaml and README.md.
#
# Everything here is infrastructure — how to reach the sig repos and what to run.
# The one key the values repo sets is copy_to_sigs, below.
day2:
  # WHICH sigs this cluster is registered with. Empty here on purpose: the values
  # repo (gitops-day1/platform-config) is the only place a sig is ever turned on,
  # and with the list empty this chart renders no Job at all.
  #
  # A name being in the list IS the enablement — there is no enabled: flag, which
  # matches day2's own "the folder is the registration" idiom and leaves no way
  # for two switches to disagree.
  #
  # Set it globally in sites/configValues.yaml, and narrow it at any layer below:
  #
  #   day2:
  #     copy_to_sigs: [redbull, nasa]
  #
  # Helm REPLACES lists rather than merging them, so a lower layer states the
  # complete set for its scope rather than patching the one above it —
  # `day2: { copy_to_sigs: [redbull] }` in an MCE's values.yaml means exactly
  # redbull there, and `[]` means none. That is the intended way to narrow it.
  #
  # Each name becomes a repo URL and a path inside the checkout, so names are
  # validated against ^[a-z0-9][a-z0-9-]*$ (day2.validSigName) — a name with a
  # slash or a .. in it would write outside the folder this Job may touch.
  copy_to_sigs: []

  # Branch to clone and push in every sig repo. One value, not per sig: they all
  # use the same one, and a sig that did not would be the exception worth its own
  # conversation rather than its own config key.
  branch: main

  # The push credential. Mounted into the Job from a Secret by secretKeyRef, never
  # passed on a command line, and handed to git through a credential helper so it
  # never reaches a URL, argv or `git remote -v` either.
  #
  # The token must be able to push to the sig repos' default branch. Note that a
  # direct push bypasses those repos' blocking MR lint; that is acceptable because
  # the only thing pushed is a folder whose day1 parity is guaranteed by
  # construction (the day1 file is what created this Application). If the branch is
  # protected the push is rejected and the Job fails loudly, which is the intended
  # failure mode rather than a silent skip.
  tokenSecretRef:
    name: day2-git-token
    key: token

  git:
    # Committer identity on the generated commits. A distinct bot identity, so the
    # sig repos' history shows plainly which commits came from this automation —
    # the same convention the day1 segment-allocation workflow follows.
    userName: day2-cluster-registration
    userEmail: day2-cluster-registration@redbull.local

    # Skip TLS verification on the git operations.
    #
    # false because the host here uses a publicly trusted CA. Set it true only if
    # the clone fails on certificate verification, i.e. the signing CA is not in
    # the image's trust store.
    insecureSkipTLSVerify: false
