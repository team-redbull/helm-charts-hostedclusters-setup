# Base of the merge. Argo CD layers the four values-repo files on top of this, in
# order (hcAppset.yaml):
#
#   this file                                             <- dhcp_api, crossplane
#     -> sites/configValues.yaml                          <- dhcp_values globals
#       -> sites/<site>/values.yaml
#         -> sites/<site>/mces/<mce>/values.yaml
#           -> sites/<site>/mces/<mce>/hostedClusters/<cluster>.yaml
#
# A key set here cannot be unset downstream, so this file carries only what is
# genuinely constant across every hosted cluster.

# The hosted cluster's own name, e.g. "ocp4-prep-herzi-site1-a".
#
# Passed in by hcAppset.yaml as a Helm parameter (--set), NOT from the values repo: it comes
# from the name of the cluster's values file, and Helm has no notion of which file a value
# came from — it merges the four valueFiles into one flat .Values. The appset derives it
# from the same `.path.filename | trimSuffix` expression that names the Application.
#
# dhcp_values.scopeName defaults to this, so a values file never has to repeat a name its
# own file name already carries. A chart-owned key rather than injecting straight into
# dhcp_values.scopeName because helm parameters outrank valueFiles: written there, an
# explicit scopeName in a values file could never win.
#
# Empty here so a render without the appset fails loudly in dhcp.scopeName rather than
# silently producing a scope with no name.
clusterName: ""

crossplane:
  # Namespace the Request CR is created in. The chart renders the NAMESPACED Request
  # kind (http.m.crossplane.io/v1alpha2, Crossplane v2's `.m.` group), so this field
  # is always emitted — an object with no namespace would land in `default`.
  #
  # provider-http v1.0.14 ships two separate Request CRDs; confirm both with:
  #
  #   kubectl get crd requests.http.crossplane.io   -o jsonpath='{.spec.scope}'  # Cluster
  #   kubectl get crd requests.http.m.crossplane.io -o jsonpath='{.spec.scope}'  # Namespaced
  #
  # No default here on purpose: dhcp.crNamespace derives `hcp-<clusterName>` when this
  # is unset, and a value set in this file could not be unset downstream. Set it to
  # pin every cluster's Request to one namespace instead.
  #
  # It also supplies the default namespace for the Bearer-token placeholder below, so
  # a Secret sitting beside the Request needs no explicit ref. hcAppset.yaml points the
  # Application's destination at openshift-gitops, so Argo CD's AppProject has to permit
  # writes into whichever namespace this resolves to — a resource declaring a namespace
  # outside the project's destinations is refused at sync time, and the error names the
  # project rather than the namespace.

  # Name of the Crossplane provider config holding the DHCP API connection.
  # Installed by redbull-platform's provider-http chart.
  #
  # This must be an object in the `.m.` group — a namespaced Request cannot reference
  # the legacy http.crossplane.io ProviderConfig of the same name. Kind is configurable
  # because the group offers both: ClusterProviderConfig (cluster-wide, the default —
  # one DHCP API serves the whole platform) and ProviderConfig (namespaced, which would
  # need one per hosted-cluster namespace).
  providerConfigKind: ClusterProviderConfig
  providerConfigName: dhcp-http

# Where the DHCP scope API lives.
#
# A platform constant, not per-cluster config: there is one Windows DHCP server
# (plus its failover partner) shared by every site, and one API in front of it.
# The partner is a failover peer, not an independent server — it gets no API of
# its own and is managed through the failover relationship on the primary.
#
# In-cluster Service address on purpose: Crossplane provider-http runs in the
# same cluster, so a Route would add a public hop and TLS for no benefit.
#
# If a genuinely separate DHCP server ever appears it needs its own API, and this
# key moves down to sites/<site>/values.yaml. Nothing in the chart or the CI
# validator has to change for that — Helm merges it and the validator ignores
# keys it does not own.
dhcp_api:
  url: http://dhcp-scope-manager.dhcp-scope-manager.svc.cluster.local:8080

  # Bearer token for the API. The API disables auth entirely when its own
  # DHCP_API_TOKEN is unset, and an empty ref here renders no Authorization
  # header at all — so this was `{}` while the API ran unauthenticated.
  #
  # It is filled in because the API requires a Bearer token from the moment the
  # deploy chart is up, and a Request with no Authorization header gets 401 on
  # every reconcile. The default tracks the OUT-OF-BAND `dhcp-scope-manager-token`
  # Secret that redbull-platform pins via apiAuth.existingSecret — NOT the deploy
  # chart's generated `<release>-api-token`: that generated Secret's
  # lookup-then-generate is a no-op under Argo CD (`helm template` has no
  # `lookup`), so every re-render ROTATED it, 401-ing all Requests here until the
  # next coincidence realigned them. provider-http's ClusterRole grants secrets/*
  # cluster-wide, so reading across namespaces needs no extra RBAC.
  #
  # All three keys are required: provider-http resolves them from the live Secret
  # at reconcile time and stores only the {{ name:namespace:key }} placeholder in
  # the CR's spec and logs, so the token never reaches git or the Argo CD UI. A
  # partially-filled ref renders no header rather than an unresolvable placeholder
  # sent as literal text.
  #
  # Set `tokenSecretRef: null` to go back to unauthenticated requests.
  tokenSecretRef:
    name: dhcp-scope-manager-token
    namespace: dhcp-scope-manager
    key: api-token

# dhcp_values is NOT set here on purpose.
#
# It is owned entirely by the values repo (day1 / platform-config). A value set
# here would be inherited by every hosted cluster and could not be unset by a
# site or cluster file — and since the Request CR is named after
# dhcp_values.network, every cluster would collide on one object name.
#
# The DHCP template is gated on dhcp_values.network, so a cluster file with no
# dhcp_values block renders no Request at all. That is the correct outcome for a
# cluster that does not need a scope. (It was gated on scopeName until that gained a
# default — see dhcp.scopeName — which made it resolve for every cluster and gate
# nothing. network is the scope's identity and only a cluster's own file ever sets it.)
#
# See docs/dhcp_values.md in team-redbull/dhcp_scope_manager for the field
# reference.
