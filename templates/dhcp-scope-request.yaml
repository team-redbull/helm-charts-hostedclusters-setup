{{- /* Gated on network, the scope's identity (CLAUDE.md section 5: "the sole identifier of
       the resource") and the one dhcp_values key only a cluster's own file ever sets. So
       "does this cluster have a subnet of its own?" is exactly "does this cluster want a
       DHCP scope?", and the gate now tests the same key as the `required` below — the
       template can no longer enter a branch it cannot finish.

       NOT scopeName: it defaults to the hosted cluster's name (dhcp.scopeName), so it
       resolves for every cluster and gates nothing. Leaving it here would render a Request
       for a cluster that never asked for one, and in the air-gapped copy of this chart —
       which also carries the HostedCluster/NodePool — the `required` below would then fail
       the *whole* render, taking down the resources that actually provision the cluster.

       hasKey, not truthiness, so that omitting network and writing it empty stay different
       things — the same distinction gateway draws below. An absent key means "this cluster
       wants no scope" and renders nothing; `network: ""` is a malformed scope and must
       reach the `required` guard rather than disappear silently.

       The .Values.dhcp_values half is a nil guard, not a redundant truthiness check: with
       no dhcp_values key at all, hasKey would be handed a nil rather than a map. `and`
       short-circuits, so the second operand is never reached. sites/configValues.yaml
       normally makes it truthy for everyone, but not when the chart renders without the
       values repo. */}}
{{- if and .Values.dhcp_values (hasKey .Values.dhcp_values "network") }}
{{- $ns := include "dhcp.crNamespace" . }}
{{- /* default dict so a chart copy whose values.yaml lost dhcp_api still fails on the
       `required "dhcp_api.url is required"` below, which names the missing key, rather
       than on a nil dereference in the TLS line — and so the hasKey there is handed a
       map either way. */}}
{{- $api := .Values.dhcp_api | default dict }}
{{- /* The NAMESPACED Request kind, from Crossplane v2's `.m.` API group. provider-http
       v1.0.14 ships two Request CRDs and they are separate resources, not two versions of
       one: http.crossplane.io/v1alpha2 (spec.scope: Cluster) and this one
       (spec.scope: Namespaced). Confirm with
       `kubectl get crd requests.http.m.crossplane.io -o jsonpath='{.spec.scope}'`.
       Namespaced is the newer of the two — the note this replaced had it backwards. */}}
apiVersion: http.m.crossplane.io/v1alpha2
kind: Request
metadata:
  name: dhcp-scope-{{ required "dhcp_values.network is required" .Values.dhcp_values.network | replace "." "-" }}
  {{- /* Always rendered now, and it must be: this kind is namespaced, so an object with no
         namespace lands in `default` rather than being dropped. This is the Request's
         namespace ONLY — the token Secret's is its own value (see the Authorization
         header below), so that one credential can serve every hosted cluster. */}}
  namespace: {{ $ns }}
spec:
  {{- /* managementPolicies replaces deletionPolicy, which does not exist on this kind: the
         namespaced spec carries only forProvider, managementPolicies, providerConfigRef and
         writeConnectionSecretToRef, and a CRD prunes unknown fields silently — a rendered
         deletionPolicy would look set in git while being absent on the server.

         "*" is every action (Observe, Create, Update, Delete, LateInitialize) and is also
         the CRD's own default, so this is written out rather than relied upon: full
         management is what makes a deleted CR delete the scope, and that is the behaviour
         the GitOps flow in CLAUDE.md section 9 depends on. Left implicit, a future default
         change would silently strip Delete and leave orphaned scopes behind on the Windows
         server with nothing in git recording that it was ever meant to be otherwise. */}}
  managementPolicies:
    - "*"
  providerConfigRef:
    {{- /* kind is REQUIRED on this group (the schema lists both kind and name as required),
           because a namespaced Request can reference either a namespaced ProviderConfig in
           its own namespace or a cluster-wide ClusterProviderConfig. ClusterProviderConfig by
           default: there is one DHCP API for the whole platform, so one config shared by
           every hosted cluster's namespace matches how the API is actually deployed.
           NOTE this is a *different object* from the legacy http.crossplane.io ProviderConfig
           — the `.m.` group cannot reference it, so one has to exist in the new group. */}}
    kind: {{ .Values.crossplane.providerConfigKind | default "ClusterProviderConfig" }}
    name: {{ .Values.crossplane.providerConfigName | default "dhcp-http" }}
  forProvider:
    {{- /* provider-http verifies the API's TLS certificate on every request it makes.
           Against an https dhcp_api.url that is an OpenShift Route, that fails with
           "x509: certificate signed by unknown authority" — the ingress certificate is
           signed by the cluster's own CA, which the provider pod has no reason to trust.
           Nothing recovers on retry: the request never leaves the provider, so the scope
           is never created and the Request stays unready with the x509 error in status.

           Default true, i.e. skip verification. It costs nothing in this chart copy,
           whose url is plain http to an in-cluster Service (no TLS to verify at all),
           and it is what makes the air-gapped copy work at all, where the API is reached
           through a Route. The cost is that the Bearer token above rides an unverified
           connection, so set dhcp_api.insecureSkipTLSVerify: false once provider-http
           trusts that CA — either through its pod's trust bundle or a forProvider
           tlsConfig, which the CRD refuses to combine with a true here (a CEL rule that
           fires only on true, so rendering false beside one is fine).

           ternary rather than `| default true`: sprig's default treats false as empty,
           so an explicit false would render as true and the key could never be turned
           off. hasKey keeps "not configured" apart from "configured off", the same
           distinction the network gate above draws. */}}
    insecureSkipTLSVerify: {{ ternary $api.insecureSkipTLSVerify true (hasKey $api "insecureSkipTLSVerify") }}
    headers:
      Content-Type:
        - "application/json"
      Accept:
        - "application/json"
      {{- with .Values.dhcp_api.tokenSecretRef }}
      {{- if and .name .key }}
      # provider-http resolves {{ "{{" }} name:namespace:key {{ "}}" }} against a live Secret at
      # reconcile time and sends the resolved value, while storing only the
      # placeholder in spec, status.requestDetails and its own logs — so the token
      # never lands in git or in the Argo CD UI. Placeholders work in headers and
      # body only. NOT secretInjectionConfigs: that runs the other direction,
      # extracting response fields *into* a Secret.
      #
      # The namespace comes from tokenSecretRef, NOT from $ns, and both chart copies
      # set it to dhcp-scope-manager. It used to fall back to the Request's own, which
      # in the air-gapped environment is hcp-<clusterName> — one copy of the token per
      # hosted cluster. Now the token is deployed once per cluster and every Request
      # reads that one Secret across namespaces (provider-http's ClusterRole grants
      # secrets/* cluster-wide). The `| default $ns` below is the fallback for a chart
      # copy that omits the key; nothing in production relies on it.
      #
      # It has to be written in rather than inherited: provider-http's regex demands
      # three literal segments and is never handed the CR's namespace, and a
      # placeholder it cannot parse is left in the header as literal text with no error
      # raised — surfacing as a 401 that names nothing. That matters more now that this
      # namespace and the CR's are separate values and so CAN disagree.
      #
      # Still required even though the API's scope GETs are anonymous: a Request writes.
      Authorization:
        - {{ printf "Bearer {{ %s:%s:%s }}" .name (.namespace | default $ns) .key | quote }}
      {{- end }}
      {{- end }}

    payload:
      # The scope address is the resource identifier, so it lives in the URL only —
      # it is deliberately absent from the body. Baked in here at template time
      # because dhcp_values.network is already required for the object name above.
      baseUrl: "{{ required "dhcp_api.url is required" .Values.dhcp_api.url }}/api/v1/scopes/{{ required "dhcp_values.network is required" .Values.dhcp_values.network }}"
      # A JSON *string*, not a mapping — provider-http types this field as a string
      # and the API server rejects anything else. The mappings below parse it with jq.
      body: |
        {{- include "dhcp.payload" . | nindent 8 }}

    mappings:
      - method: "POST"
        url: (.payload.baseUrl)
        body: .payload.body

      - method: "GET"
        url: (.payload.baseUrl)

      - method: "PUT"
        url: (.payload.baseUrl)
        body: .payload.body

      - method: "DELETE"
        url: (.payload.baseUrl)
{{- end }}